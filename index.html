<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 雲教室備課資料 v1.7.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
    </script>
    
    <style>
        :root {
            --primary-bg: #f9fafb; 
            --header-bg: #ffffff; 
            --header-text: #1d4ed8; 
            --btn-hover-scale: 1.02; 
        }

        body { 
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; 
            background-color: var(--primary-bg);
        }

        .modal { transition: opacity 0.3s ease, visibility 0.3s ease; }
        .modal-content { transition: transform 0.3s ease; }
        .modal.hidden { visibility: hidden; opacity: 0; }
        .modal.visible { visibility: visible; opacity: 1; }
        .modal.visible .modal-content { transform: translateY(0); }
        .modal.hidden .modal-content { transform: translateY(-20px); }
        
        .nav-button {
            @apply w-full text-left px-5 py-4 bg-white shadow rounded-lg border border-gray-200 transition-all duration-200 ease-in-out;
            @apply hover:bg-blue-50 hover:shadow-md hover:border-blue-300;
            transform: scale(1);
        }
        .nav-button:hover {
            transform: scale(var(--btn-hover-scale));
        }
        .nav-button-disabled {
            @apply w-full text-left px-5 py-4 bg-gray-100 shadow-inner rounded-lg border border-gray-200 text-gray-400 cursor-not-allowed opacity-60;
        }
        
        #batchLog p { @apply py-1 px-2 border-b border-gray-100; }
        #batchLog p.error { @apply bg-red-100 text-red-700; }
        #batchLog p.success { @apply bg-green-50 text-green-700; }
        #batchLog p.info { @apply text-blue-700 font-semibold; }
        
        #file-upload-input {
            @apply block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none;
            @apply file:bg-indigo-600 file:text-white file:font-semibold file:border-0 file:py-2 file:px-4 file:mr-4 file:cursor-pointer transition-colors;
        }
        #file-upload-input:hover::file-selector-button { @apply bg-indigo-700; }
        
        .ai-preview-box { @apply bg-white p-4 rounded-lg border border-gray-300 shadow-sm grid grid-cols-1 md:grid-cols-4 gap-3; }
        .ai-preview-box label { @apply block text-xs font-medium text-gray-500 mb-1; }
        .ai-preview-box input, .ai-preview-box textarea { @apply w-full p-2 border rounded-md text-sm font-mono bg-gray-50; }
        .ai-preview-box .content-area { @apply md:col-span-4; }
        
        .custom-subject-tag {
            @apply inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-purple-100 text-purple-800 border border-purple-200;
        }
        
        .shortcut-item-exit {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* 遊戲化 UX：已加入常用時的 Hover 切換效果 */
        .btn-shortcut-saved {
            @apply bg-green-100 text-green-700 border-green-300;
        }
        .btn-shortcut-saved:hover {
            @apply bg-red-100 text-red-700 border-red-300;
        }
        .btn-shortcut-saved::before {
            content: "🌟 已存為常用";
        }
        .btn-shortcut-saved:hover::before {
            content: "❌ 取消常用";
        }
    </style>
</head>
<body class="pt-20">

    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-30" style="background-color: var(--header-bg);">
        <div class="container mx-auto max-w-5xl flex flex-col md:flex-row justify-between items-center p-4 gap-3">
            <h1 class="text-2xl font-bold" style="color: var(--header-text);">📚 雲教室備課資料 v1.7.1</h1>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <select id="workspaceSwitcher" title="快速切換常用教學區" class="flex-grow md:flex-grow-0 p-2 border-2 border-blue-300 rounded-lg text-sm bg-blue-50 text-blue-800 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm cursor-pointer transition-all hover:bg-blue-100">
                    <option value="">🏫 選擇教學區...</option>
                </select>
                 <button id="settingsBtn" title="登入管理" class="text-3xl hover:text-blue-600 transition-transform duration-200 hover:rotate-12 flex-shrink-0">⚙️</button>
                 <button id="logoutBtn" title="登出管理" class="text-3xl hover:text-red-500 transition-all hidden flex-shrink-0">🔓</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto max-w-5xl p-4 mt-4 md:mt-0">
        <div class="flex justify-between items-center mb-4">
            <div id="breadcrumb" class="text-gray-600 font-semibold text-sm md:text-base"></div>
            <button id="saveWorkspaceBtn" class="hidden bg-yellow-100 hover:bg-yellow-200 text-yellow-800 border border-yellow-300 font-bold py-1 px-3 rounded shadow-sm text-sm transition-all transform hover:scale-105 active:scale-95">
                ⭐ 設為常用
            </button>
        </div>
        
        <div id="navigator" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        <div id="loading" class="text-center p-10 text-gray-500 hidden">
            <p class="animate-pulse text-lg">🔄 正在載入資料庫，請稍候...</p>
        </div>
        
        <div id="content-display-area" class="hidden mt-6 animate-fade-in">
             <div class="bg-white p-6 rounded-xl shadow-lg border">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                    <h3 id="content-title" class="text-xl font-bold text-gray-800"></h3>
                    <button id="copy-content-btn" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-all shadow hover:shadow-lg transform hover:-translate-y-0.5">
                        📋 點擊一鍵複製
                    </button>
                </div>
                <textarea id="content-textarea" readonly class="w-full h-80 p-4 bg-gray-50 border border-gray-300 rounded-md font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-y"></textarea>
            </div>
        </div>
    </main>

    <!-- ⚙️ 管理後台模態框 -->
    <div id="adminModal" class="modal hidden fixed inset-0 bg-gray-900 bg-opacity-75 z-40 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="modal-content bg-gray-50 rounded-2xl shadow-2xl w-full max-w-7xl max-h-[90vh] overflow-hidden flex flex-col border border-gray-200">
            <header class="p-5 border-b bg-white rounded-t-2xl flex justify-between items-center shadow-sm z-10">
                <h2 class="text-2xl font-bold text-gray-800">🔐 教材管理後台 (v1.7.1)</h2>
                <button id="closeAdminBtn" class="text-4xl text-gray-400 hover:text-red-500 transition-colors">&times;</button>
            </header>
            
            <div id="adminForm" class="p-6 flex-grow overflow-y-auto">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    
                    <!-- 左半部 -->
                    <div class="space-y-6">
                        <section class="bg-yellow-50 p-5 rounded-xl border border-yellow-200 shadow-sm">
                            <h3 class="text-lg font-semibold text-yellow-800 mb-3 flex items-center gap-2">🤖 AI 助理設定</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <div class="md:col-span-2">
                                    <input type="password" id="googleAiApiKey" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400" placeholder="在此貼上 API 金鑰...">
                                </div>
                                <div>
                                    <input type="text" id="googleAiModelName" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400" value="gemini-1.5-flash-latest">
                                </div>
                            </div>
                            <div class="mt-3 flex items-center gap-3">
                                <button id="saveAiSettingsBtn" type="button" class="px-5 py-2.5 bg-yellow-600 hover:bg-yellow-700 text-white font-semibold rounded-lg shadow transition-colors">儲存設定</button>
                                <span id="aiSettingsStatus" class="text-xs text-gray-500 font-mono"></span>
                            </div>
                        </section>

                        <section class="bg-purple-50 p-5 rounded-xl border border-purple-200 shadow-sm">
                            <h3 class="text-lg font-semibold text-purple-800 mb-3 flex items-center gap-2">➕ 自訂科目管理</h3>
                            <div class="flex flex-col sm:flex-row gap-2 mb-4">
                                <input type="text" id="customSubjectName" placeholder="科目中文 (例: 綜合)" class="flex-1 p-2 border rounded-md text-sm focus:ring-2 focus:ring-purple-400">
                                <input type="text" id="customSubjectId" placeholder="英文代號 (例: Comprehensive)" class="flex-1 p-2 border rounded-md text-sm focus:ring-2 focus:ring-purple-400 font-mono">
                                <button id="addCustomSubjectBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-md font-bold shadow transition-colors">新增</button>
                            </div>
                            <div id="customSubjectList" class="flex flex-wrap gap-2 min-h-[32px] p-2 bg-white rounded-md border border-purple-100"></div>
                        </section>

                        <!-- ▼ 新增：常用教學區管理 ▼ -->
                        <section class="bg-orange-50 p-5 rounded-xl border border-orange-200 shadow-sm mt-6 hover:shadow-md transition-shadow">
                            <h3 class="text-lg font-semibold text-orange-800 mb-3 flex items-center gap-2">⭐ 常用教學區管理</h3>
                            <div id="shortcutList" class="flex flex-wrap gap-2 min-h-[32px] p-2 bg-white rounded-md border border-orange-100 transition-all"></div>
                        </section>
                        <!-- ▲ 新增結束 ▲ -->
                        
                        <section class="bg-indigo-50 p-5 rounded-xl border border-indigo-200 shadow-sm">
                            <h3 class="text-lg font-semibold text-indigo-800 mb-3 flex items-center gap-2">🧠 AI 資料解析 (批次匯入)</h3>
                            <input id="file-upload-input" type="file" accept=".txt,.pdf" class="mb-3">
                            <select id="analysisMode" class="w-full p-2.5 border border-gray-300 rounded-lg mb-3 bg-white focus:ring-2 focus:ring-indigo-400 text-sm">
                                <option value="ai_shengzi">📝 解析模式：生字 (單行密集型)</option>
                                <option value="ai_lesson_text">📖 解析模式：完整課文 (多段落長文件)</option>
                                <option value="ai_terms">🗣️ 解析模式：語詞 (擷取區塊語詞)</option>
                                <option value="ai_patterns">🧩 解析模式：句型/短語/造句 (結構化分析)</option>
                            </select>
                            <textarea id="text-input-area" rows="6" class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm bg-white focus:ring-2 focus:ring-indigo-400 mb-3" placeholder="讀取之原始文字將顯示於此..."></textarea>
                            <input type="text" id="ai-extra-prompt" class="w-full p-2.5 border border-gray-300 rounded-lg bg-white mb-4 text-sm" placeholder="✏️ (選填) 額外 AI 指令，例：請只擷取標題為「一、」的內容">

                            <button id="batchUploadBtn" type="button" class="w-full px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg rounded-lg shadow-md transition-all transform hover:scale-[1.02] disabled:bg-gray-400 disabled:scale-100">
                                🔬 啟動 AI 分析
                            </button>
                            
                            <div id="ai-preview-area" class="mt-5 hidden space-y-3 bg-white p-4 rounded-lg border border-indigo-200">
                                <label class="block text-sm font-bold text-indigo-700 border-b pb-2">審查 AI 分析結果 (可手動修改)</label>
                                <div id="ai-result-preview-dynamic" class="space-y-4 max-h-80 overflow-y-auto p-2 bg-gray-50 rounded-md"></div>
                                <button id="confirmBatchUploadBtn" type="button" class="w-full px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-md transition-all transform hover:-translate-y-1">
                                    🚀 確認無誤，寫入資料庫
                                </button>
                            </div>
                            <div id="batchLog" class="mt-4 p-3 bg-gray-900 text-green-400 rounded-md border border-gray-700 max-h-40 overflow-y-auto text-xs font-mono hidden shadow-inner"></div>
                        </section>
                    </div>

                    <!-- 右半部 -->
                    <div class="space-y-6">
                        <section class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                            <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">📍 1. 選擇要編輯的教材節點</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 p-4 bg-gray-50 rounded-lg border border-gray-100">
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">版本</label><select id="adminPublisher" class="w-full p-2 border rounded-md text-sm"><option value="Hanlin">翰林</option><option value="Nanyi">南一</option><option value="Kangxuan">康軒</option></select></div>
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">科目</label><select id="adminSubject" class="w-full p-2 border rounded-md text-sm"></select></div>
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">學期</label><select id="adminSemester" class="w-full p-2 border rounded-md text-sm"><option value="S1">上學期</option><option value="S2">下學期</option></select></div>
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">年級</label><select id="adminGrade" class="w-full p-2 border rounded-md text-sm"><option value="G1">一年級</option><option value="G2">二年級</option><option value="G3">三年級</option><option value="G4">四年級</option><option value="G5">五年級</option><option value="G6">六年級</option></select></div>
                            </div>
                            
                            <div class="flex flex-wrap gap-2 mb-4">
                                <button id="fetchUnitsBtn" type="button" class="flex-1 px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold border border-blue-200 rounded-md transition-colors text-sm">🔄 偵測現有單元</button>
                                <button id="createNewUnitBtn" type="button" class="flex-1 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold border border-gray-300 rounded-md transition-colors text-sm">➕ 建立新單元</button>
                            </div>

                            <div id="unitInputContainer" class="p-4 bg-blue-50 rounded-lg border border-blue-100">
                                <label for="adminUnitSelector" class="block text-sm font-bold text-blue-800 mb-1 hidden">選擇目標單元</label>
                                <select id="adminUnitSelector" class="w-full p-2 border border-blue-200 rounded-md bg-white hidden focus:ring-2 focus:ring-blue-400"></select>
                                
                                <label for="adminUnitId" class="block text-sm font-bold text-blue-800 mb-1">輸入單元代號 (例: L1)</label>
                                <input type="text" id="adminUnitId" class="w-full p-2 border border-blue-200 rounded-md bg-white focus:ring-2 focus:ring-blue-400" placeholder="例如: L1">
                                <p id="adminDocIdPreview" class="text-xs font-mono font-bold mt-2 text-blue-600"></p>
                            </div>

                            <div class="flex gap-3 mt-5">
                                <button id="loadDataBtn" type="button" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition-colors">📥 載入內容</button>
                                <button id="deleteDocBtn" type="button" class="flex-1 py-2.5 bg-red-100 hover:bg-red-600 hover:text-white text-red-700 font-bold rounded-lg border border-red-200 transition-colors">🗑️ 刪除此單元</button>
                            </div>
                        </section>
                        
                        <section class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                            <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">📝 2. 手動編輯欄位</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-400 transition-all"><div class="flex justify-between items-center mb-1"><input type="text" id="adminLabel1" class="w-2/3 p-1 border-b border-gray-300 bg-transparent text-sm font-bold focus:outline-none focus:border-blue-500" placeholder="欄位名稱 (例: 生字)"><button type="button" class="text-xs text-red-400 hover:text-red-600 font-semibold" data-clear-id="1">清空</button></div><textarea id="adminContent1" rows="4" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:outline-none" placeholder="每行一筆..."></textarea></div>
                                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-400 transition-all"><div class="flex justify-between items-center mb-1"><input type="text" id="adminLabel2" class="w-2/3 p-1 border-b border-gray-300 bg-transparent text-sm font-bold focus:outline-none focus:border-blue-500" placeholder="欄位名稱 (例: 語詞)"><button type="button" class="text-xs text-red-400 hover:text-red-600 font-semibold" data-clear-id="2">清空</button></div><textarea id="adminContent2" rows="4" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:outline-none"></textarea></div>
                                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-400 transition-all"><div class="flex justify-between items-center mb-1"><input type="text" id="adminLabel3" class="w-2/3 p-1 border-b border-gray-300 bg-transparent text-sm font-bold focus:outline-none focus:border-blue-500" placeholder="欄位名稱 (例: 句型)"><button type="button" class="text-xs text-red-400 hover:text-red-600 font-semibold" data-clear-id="3">清空</button></div><textarea id="adminContent3" rows="4" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:outline-none"></textarea></div>
                                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-400 transition-all"><div class="flex justify-between items-center mb-1"><input type="text" id="adminLabel4" class="w-2/3 p-1 border-b border-gray-300 bg-transparent text-sm font-bold focus:outline-none focus:border-blue-500" placeholder="欄位名稱 (例: 重點)"><button type="button" class="text-xs text-red-400 hover:text-red-600 font-semibold" data-clear-id="4">清空</button></div><textarea id="adminContent4" rows="4" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:outline-none"></textarea></div>
                            </div>
                            <div class="mt-4 bg-gray-50 p-3 rounded-lg border border-gray-200 focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-400 transition-all"><div class="flex justify-between items-center mb-1"><input type="text" id="adminLabel5" class="w-1/2 p-1 border-b border-gray-300 bg-transparent text-sm font-bold focus:outline-none focus:border-blue-500" placeholder="欄位 5 名稱 (備用)"><button type="button" class="text-xs text-red-400 hover:text-red-600 font-semibold" data-clear-id="5">清空</button></div><textarea id="adminContent5" rows="2" class="w-full p-2 border border-gray-300 rounded text-sm bg-white focus:outline-none"></textarea></div>
                            <div class="mt-4"><label class="block text-sm font-bold text-gray-700 mb-1">主要大段落內容 (如：完整課文)</label><textarea id="adminMainText" rows="6" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm bg-white shadow-inner" placeholder="在此貼上不需切割斷行的長篇文章..."></textarea></div>
                        </section>
                    </div>

                    <!-- 🗄️ v1.7.1 新增：資料維護與安全清理中心 -->
                    <section class="mt-2 bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-md col-span-1 lg:col-span-2">
                        <h3 class="text-lg font-semibold text-white mb-2 flex items-center gap-2">🗄️ 資料維護與安全清理中心</h3>
                        <p class="text-sm text-gray-400 mb-4">執行備份、還原合併與防呆清理。高風險動作均帶有確認機制，請謹慎操作。</p>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3">
                            <button id="btnExportBackup" class="px-4 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-sm shadow transition-colors flex items-center justify-center gap-1">📦 封存目前資料</button>

                            <button id="btnImportBackup" class="px-4 py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg text-sm shadow transition-colors flex items-center justify-center gap-1">📂 匯入備份還原</button>
                            <input type="file" id="importJsonInput" accept=".json" class="hidden">

                            <button id="btnClearLevelA" class="px-4 py-3 bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold rounded-lg text-sm shadow transition-colors flex items-center justify-center gap-1">🧹 層級A: 清空面板</button>

                            <button id="btnClearLevelB" class="px-4 py-3 bg-orange-600 hover:bg-orange-500 text-white font-bold rounded-lg text-sm shadow transition-colors flex items-center justify-center gap-1">🗑️ 層級B: 刪除學期</button>

                            <button id="btnClearLevelC" class="px-4 py-3 bg-red-700 hover:bg-red-600 text-white font-bold rounded-lg text-sm shadow transition-colors border border-red-500 flex items-center justify-center gap-1">☢️ 層級C: 全機重置</button>
                        </div>
                    </section>
                </div> 
            </div>
            
            <footer class="p-5 border-t bg-gray-50 rounded-b-2xl flex justify-end gap-3 z-10 shadow-[0_-5px_15px_-5px_rgba(0,0,0,0.1)]">
                <button id="saveDataBtn" type="button" class="w-full md:w-64 px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg rounded-xl shadow-lg transition-all transform hover:-translate-y-1 hover:shadow-xl">
                    💾 儲存寫入單元
                </button>
            </footer>
        </div>
    </div>

    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 -translate-y-20 bg-blue-600 text-white py-3 px-8 rounded-full shadow-2xl transition-all duration-300 opacity-0 z-50 font-bold tracking-wide border-2 border-white/20">
        <span id="toast-message" class="flex items-center gap-2"></span>

    /* Audio System */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'click') {
                oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(800, now);
                oscillator.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                oscillator.start(now); oscillator.stop(now + 0.05);
            } else if (type === 'success') {
                oscillator.type = 'triangle'; oscillator.frequency.setValueAtTime(400, now);
                oscillator.frequency.linearRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.15, now + 0.05);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                oscillator.start(now); oscillator.stop(now + 0.3);
            } else if (type === 'error') {
                oscillator.type = 'sawtooth'; oscillator.frequency.setValueAtTime(150, now);
                oscillator.frequency.setValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                oscillator.start(now); oscillator.stop(now + 0.3);
            }
        } catch (e) { console.warn(e); }
    }

    /* Constants */

        btnClearLevelB: document.getElementById("btnClearLevelB"), btnClearLevelC: document.getElementById("btnClearLevelC")
    };
    
    function showToast(message, type = 'success') {
        if(type === 'success' || type === 'info') playSound('success'); else playSound('error');
        dom.toastMessage.innerHTML = type === 'error' ? `⚠️ ${message}` : message;
        dom.toast.className = `fixed top-5 left-1/2 transform -translate-x-1/2 -translate-y-20 text-white py-3 px-8 rounded-full shadow-2xl transition-all duration-300 opacity-0 z-50 font-bold tracking-wide border-2 border-white/20 ${type === 'error' ? 'bg-red-600' : (type === 'info' ? 'bg-gray-700' : 'bg-blue-600')}`;
        
        requestAnimationFrame(() => {
            dom.toast.classList.remove('-translate-y-20', 'opacity-0'); dom.toast.classList.add('translate-y-0', 'opacity-100');
        });
        setTimeout(() => {
            dom.toast.classList.remove('translate-y-0', 'opacity-100'); dom.toast.classList.add('-translate-y-20', 'opacity-0');
        }, 3500);
    }

    /* --- Shortcuts & Custom Subjects --- */
    function loadWorkspaceSwitcher() {
        const shortcuts = JSON.parse(localStorage.getItem(SHORTCUTS_STORAGE_KEY) || "{}");
        const switcher = dom.workspaceSwitcher;
        if (Object.keys(shortcuts).length === 0) { switcher.classList.add("hidden"); return; }
        switcher.classList.remove("hidden"); switcher.innerHTML = '<option value="">🏫 快速切換教學區...</option>';
        Object.entries(shortcuts).forEach(([pathStr, labelStr]) => {
            const opt = document.createElement("option"); opt.value = pathStr; opt.textContent = `⭐ ${labelStr}`;
            switcher.appendChild(opt);
        });
        switcher.onchange = (e) => {
            if (!e.target.value) return; playSound('click');
            const pathStr = e.target.value; const pathParts = pathStr.split("_"); const labelStr = shortcuts[pathStr];
            localStorage.setItem(LAST_WORKSPACE_KEY, pathStr); currentPathParts = pathParts; currentLabels = labelStr.split(" / ");
            currentDocCache = {}; renderNavigator(4); showToast(`🚀 已切換至：${labelStr}`, "info"); switcher.value = "";
        };
    }
    function updateShortcutButtonState() {
        if (currentPathParts.length !== 4) { dom.saveWorkspaceBtn.classList.add("hidden"); return; }
        dom.saveWorkspaceBtn.classList.remove("hidden");
        const pathStr = currentPathParts.join("_"); 
        const shortcuts = JSON.parse(localStorage.getItem(SHORTCUTS_STORAGE_KEY) || "{}");
        
        // 重置按鈕內容，用 ::before 的 CSS 來控制文字切換
        dom.saveWorkspaceBtn.innerHTML = "";

            // 已是常用：套用 UX 遊戲化樣式 (Hover 切換)

        } else {
            // 尚未加入
            dom.saveWorkspaceBtn.innerHTML = "⭐ 設為常用";
            dom.saveWorkspaceBtn.className = "bg-yellow-100 hover:bg-yellow-200 text-yellow-800 border border-yellow-300 font-bold py-1 px-3 rounded shadow-sm text-sm transition-all transform hover:scale-105 active:scale-95";
        }
    }

    function toggleWorkspaceShortcut() {
        playSound('click'); if (currentPathParts.length !== 4) return;
        const pathStr = currentPathParts.join("_"); const labelStr = currentLabels.join(" / ");
        let shortcuts = JSON.parse(localStorage.getItem(SHORTCUTS_STORAGE_KEY) || "{}");
        
        if (shortcuts[pathStr]) {
            delete shortcuts[pathStr];
            if(localStorage.getItem(LAST_WORKSPACE_KEY) === pathStr) localStorage.removeItem(LAST_WORKSPACE_KEY);
            showToast("❌ 已取消常用教學區", "info");
        } else {
            shortcuts[pathStr] = labelStr; 
            localStorage.setItem(LAST_WORKSPACE_KEY, pathStr);
            showToast("🌟 已成功設為常用教學區！", "success");
        }
        localStorage.setItem(SHORTCUTS_STORAGE_KEY, JSON.stringify(shortcuts));
        loadWorkspaceSwitcher(); loadShortcutsUI(); updateShortcutButtonState();
    }

    function loadShortcutsUI() {
        if (!dom.shortcutList) return;
        const shortcuts = JSON.parse(localStorage.getItem(SHORTCUTS_STORAGE_KEY) || "{}");
        dom.shortcutList.innerHTML = Object.keys(shortcuts).length === 0 ? "<span class='text-gray-400 text-sm'>尚無常用教學區</span>" : "";
        Object.entries(shortcuts).forEach(([pathStr, labelStr]) => {
            const span = document.createElement("span"); 
            span.id = `shortcut-item-${pathStr}`;
            span.className = "inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-orange-100 text-orange-800 border border-orange-200 shadow-sm transition-all duration-300";
            span.innerHTML = `${labelStr} <button class="ml-2 text-orange-900 hover:text-red-500 font-bold transform hover:scale-110 transition-transform" onclick="removeAdminShortcut('${pathStr}')">&times;</button>`;

    window.removeAdminShortcut = function(pathStr) {

        const el = document.getElementById(`shortcut-item-${pathStr}`);
        if(el) {
            el.classList.add('shortcut-item-exit');
            setTimeout(() => {
                executeRemoveShortcut(pathStr);
            }, 250); // 動畫結束後刪除資料與更新UI
        } else {
            executeRemoveShortcut(pathStr);
        }
    };
    
    function executeRemoveShortcut(pathStr) {
        let shortcuts = JSON.parse(localStorage.getItem(SHORTCUTS_STORAGE_KEY) || "{}");
        delete shortcuts[pathStr];
        localStorage.setItem(SHORTCUTS_STORAGE_KEY, JSON.stringify(shortcuts));
        if(localStorage.getItem(LAST_WORKSPACE_KEY) === pathStr) localStorage.removeItem(LAST_WORKSPACE_KEY);
        showToast("🗑️ 已從清單移除", "info"); 
        loadShortcutsUI(); loadWorkspaceSwitcher(); updateShortcutButtonState();

        customSubjects.forEach(sub => {

            span.innerHTML = `${sub.label} <span class="opacity-70 text-xs">(${sub.key})</span><button class="ml-1 text-purple-900 hover:text-red-500 font-bold" onclick="removeCustomSubject('${sub.key}')">&times;</button>`;
            dom.customSubList.appendChild(span);

        updateAdminSubjectDropdown();

    function addCustomSubject() {
        playSound('click'); const name = dom.customSubName.value.trim(); const idStr = dom.customSubId.value.trim();
        if (!name || !idStr) return showToast("⚠️ 請完整填寫", "error");
        if(getHierarchy()[1].options.map(o => o.key.toLowerCase()).includes(idStr.toLowerCase())) return showToast("⚠️ 此代號已存在", "error");

        localStorage.setItem(SUBJECTS_STORAGE_KEY, JSON.stringify(customSubjects.filter(s => s.key !== key)));
        showToast("🗑️ 已移除", "info"); loadCustomSubjectsUI();
    };
    function updateAdminSubjectDropdown() {
        const adminSub = document.getElementById("adminSubject"); const curr = adminSub.value; adminSub.innerHTML = "";
        getHierarchy()[1].options.forEach(sub => {
            const opt = document.createElement("option"); opt.value = sub.key; opt.textContent = sub.label; adminSub.appendChild(opt);
        });
        if([...adminSub.options].some(o => o.value === curr)) adminSub.value = curr;
    }

    /* --- Navigation & Core Display --- */
    async function fetchExistingPaths() {
        dom.loading.classList.remove("hidden"); dom.navigator.classList.add("hidden");
        loadWorkspaceSwitcher(); loadCustomSubjectsUI();
        try {
            const snap = await db.collection(CURRICULUM_COLLECTION).get();
            existingPaths.clear(); snap.forEach(doc => existingPaths.add(doc.id));
            if (existingPaths.size === 0) { renderNavigator(0); } else {
                const last = localStorage.getItem(LAST_WORKSPACE_KEY); const shortcuts = JSON.parse(localStorage.getItem(SHORTCUTS_STORAGE_KEY) || "{}");
                if (last && shortcuts[last] && checkAvailability(last + "_")) {
                    currentPathParts = last.split("_"); currentLabels = shortcuts[last].split(" / "); renderNavigator(4);
                } else { renderNavigator(0); }
            }
        } catch (e) { showToast("❌ Firebase 連線失敗", "error"); } 
        finally { dom.loading.classList.add("hidden"); dom.navigator.classList.remove("hidden"); }
    }
    function checkAvailability(prefix) { for (const path of existingPaths) if (path.startsWith(prefix)) return true; return false; }
    function getSortValue(id) {
        let u=id.toUpperCase(); let m=u.match(/^L([0-9]+)Z$/); if(m) return 10000+parseInt(m[1]);
        m=u.match(/^L([0-9]+)$/); if(m) return parseInt(m[1]); m=id.match(/^([0-9]+)-([0-9]+)/);
        if(m) return parseInt(m[1])*100+parseInt(m[2]); m=id.match(/^([0-9]+)$/); if(m) return parseInt(m[1]);
        m=u.match(/^L([A-Y])/); if(m) return 20000+m[1].charCodeAt(0); return 99999; 
    }

    async function renderNavigator(level) {
        dom.navigator.innerHTML = ""; dom.contentArea.classList.add("hidden"); 
        const currentHierarchy = getHierarchy(); updateBreadcrumb(level);

        if (level === currentHierarchy.length) {
            updateShortcutButtonState();
        } else { dom.saveWorkspaceBtn.classList.add("hidden"); }

        if (level < currentHierarchy.length) {
            const step = currentHierarchy[level]; const prefix = currentPathParts.join("_") + (currentPathParts.length > 0 ? "_" : "");
            step.options.forEach(opt => {
                const isAvail = checkAvailability(prefix + opt.key); const btn = document.createElement("button");
                if (isAvail) {
                    btn.className = "nav-button"; btn.innerHTML = `<span class="text-2xl font-bold text-blue-600">${opt.label}</span>`;
                    btn.onclick = () => { playSound('click'); currentPathParts.push(opt.key); currentLabels.push(opt.label); renderNavigator(level + 1); };
                } else {
                    btn.className = "nav-button-disabled"; btn.disabled = true;
                    btn.innerHTML = `<span class="text-xl font-bold">${opt.label}</span><span class="block text-xs mt-1 text-gray-500">(尚無資料)</span>`;
                }
                dom.navigator.appendChild(btn);
            }); return;
        }
        
        if (level === currentHierarchy.length) {
            dom.loading.classList.remove("hidden"); const prefix = currentPathParts.join("_") + "_";
            let hasCache = Object.keys(currentDocCache)[0]?.startsWith(prefix);
            if (!hasCache) {
                try {
                    const snap = await db.collection(CURRICULUM_COLLECTION).where(firebase.firestore.FieldPath.documentId(), ">=", prefix).where(firebase.firestore.FieldPath.documentId(), "<", prefix + "\uf8ff").get();
                    currentDocCache = {}; snap.forEach(doc => currentDocCache[doc.id] = doc.data());
                } catch(e) { showToast("❌ 查詢失敗", "error"); dom.loading.classList.add("hidden"); return; }
            }
            dom.loading.classList.add("hidden"); const units = [];
            Object.keys(currentDocCache).forEach(id => { if (id.startsWith(prefix)) units.push({ unitId: id.replace(prefix, ""), docId: id }); });
            if (units.length === 0) { dom.navigator.innerHTML = `<p class="text-gray-500 col-span-full text-center text-lg p-10 bg-gray-50 rounded-lg border border-dashed">尚無資料。</p>`; return; }
            units.sort((a, b) => { const nA = getSortValue(a.unitId); const nB = getSortValue(b.unitId); return nA!==nB ? nA-nB : a.unitId.localeCompare(b.unitId); });
            units.forEach(({ unitId }) => {
                const btn = document.createElement("button"); btn.className = "nav-button border-l-4 border-green-500";
                btn.innerHTML = `<span class="text-2xl font-bold text-green-700">${unitId}</span>`;
                btn.onclick = () => { 
                    playSound('click'); 
                    if(sessionStorage.getItem(ADMIN_AUTH_KEY)==='true') quickEditUnit(currentPathParts.slice(0, 4), unitId);
                    else { currentPathParts.push(unitId); currentLabels.push(unitId); renderNavigator(level + 1); }
                };
                dom.navigator.appendChild(btn);
            }); return;
        }
        if (level > currentHierarchy.length) renderContentFields();
    }
    
    function updateBreadcrumb(level) {
        dom.breadcrumb.innerHTML = '<button class="hover:text-blue-700 hover:underline font-bold transition-colors" data-level="0">🏠 首頁</button>';
        currentLabels.forEach((label, i) => {
            dom.breadcrumb.innerHTML += ` <span class="mx-2 text-gray-400">/</span> <button class="hover:text-blue-700 hover:underline transition-colors font-bold" data-level="${i + 1}">${label}</button>`;
        });
        dom.breadcrumb.querySelectorAll("button").forEach(btn => {
            btn.onclick = () => {
                playSound('click'); const tLevel = parseInt(btn.dataset.level);
                if (tLevel === getHierarchy().length + 1 && sessionStorage.getItem(ADMIN_AUTH_KEY) === 'true') {
                    quickEditUnit(currentPathParts.slice(0, 4), currentPathParts[4]);
                } else {
                    currentPathParts = currentPathParts.slice(0, tLevel); currentLabels = currentLabels.slice(0, tLevel);
                    if (tLevel < 4) currentDocCache = {}; renderNavigator(tLevel);
                }
            };
        });
    }

    function renderContentFields() {
        const data = currentDocCache[currentPathParts.join("_")]; let hasContent = false;
        if (!data?.content) return dom.navigator.innerHTML = `<p class="text-gray-500 col-span-full text-center">內容為空。</p>`;
        (data.content.fields||[]).forEach(f => {
            if (f.label && f.data?.length > 0) { 
                const btn = document.createElement("button"); btn.className = "nav-button border-l-4 border-indigo-500 bg-indigo-50";
                btn.innerHTML = `<span class="text-xl font-bold text-indigo-800">${f.label}</span>`;
                btn.onclick = () => { playSound('click'); showData(f.label, f.data); };
                dom.navigator.appendChild(btn); hasContent = true;
            }
        });
        if (data.content.mainText) {
             const btn = document.createElement("button"); btn.className = "nav-button border-l-4 border-indigo-500 bg-indigo-50";
             btn.innerHTML = `<span class="text-xl font-bold text-indigo-800">主要內容 (大長篇)</span>`;
             btn.onclick = () => { playSound('click'); showData("主要內容", data.content.mainText); };
             dom.navigator.appendChild(btn); hasContent = true;
        }
        if (!hasContent) dom.navigator.innerHTML = `<p class="text-gray-500 col-span-full text-center">此單元內容為空。</p>`;
    }
    function showData(label, content) {
        dom.contentTitle.innerHTML = `<span class="text-indigo-600 font-black">${currentLabels.join(" > ")}</span> <br/><span class="text-gray-500 text-lg">📌 ${label}</span>`;
        dom.contentTextArea.value = Array.isArray(content) ? content.join("\n") : (content || "");
        dom.contentArea.classList.remove("hidden");
        dom.copyContentBtn.onclick = () => {
            playSound('click'); try { dom.contentTextArea.select(); document.execCommand('copy'); showToast("📋 已複製！", "success"); } catch (err) { showToast("❌ 複製失敗", "error"); }
        };
    }

    /* --- Admin & Setup --- */
    function saveAiSettings() {
        playSound('click'); const apiKey = document.getElementById("googleAiApiKey").value.trim();
        const modelName = document.getElementById("googleAiModelName").value.trim();

        document.getElementById("googleAiModelName").value = localStorage.getItem(API_MODEL_STORAGE_KEY) || document.getElementById("googleAiModelName").value; 
        document.getElementById("aiSettingsStatus").innerHTML = storedKey ? `<span class="text-green-600 font-bold">✓ 金鑰就緒</span>` : `<span class="text-red-500 font-bold">✗ 未設金鑰</span>`;
    }
    function updateAdminControls() {
        if (sessionStorage.getItem(ADMIN_AUTH_KEY) === 'true') { dom.logoutBtn.classList.remove('hidden'); dom.settingsBtn.title = "管理後台"; } 
        else { dom.logoutBtn.classList.add('hidden'); dom.settingsBtn.title = "登入管理"; }

    function quickEditUnit(basePath, unitId) {
        openAdminModal(); const f = getAdminFormObj();
        f.publisher.value = basePath[0]; f.subject.value = basePath[1]; f.semester.value = basePath[2]; f.grade.value = basePath[3];
        showAdminUnitInput(); f.unitId.value = unitId; updateAdminDocIdPreview(); handleLoadData(); 
    }

    function getAdminFormObj() {
        return {
            publisher: document.getElementById("adminPublisher"), subject: document.getElementById("adminSubject"),
            semester: document.getElementById("adminSemester"), grade: document.getElementById("adminGrade"),
            unitId: document.getElementById("adminUnitId"), unitSelector: document.getElementById("adminUnitSelector"),
            labels: [1,2,3,4,5].map(i => document.getElementById(`adminLabel${i}`)),
            contents: [1,2,3,4,5].map(i => document.getElementById(`adminContent${i}`)),
            mainText: document.getElementById("adminMainText"), docIdPreview: document.getElementById("adminDocIdPreview"),
        };
    }
    function getAdminDocId() {
        const f = getAdminFormObj(); const isSelect = !f.unitSelector.classList.contains('hidden');
        const unitId = isSelect ? f.unitSelector.value : f.unitId.value.trim();
        if (!unitId) return null; return [f.publisher.value, f.subject.value, f.semester.value, f.grade.value, unitId].join("_");
    }
    function updateAdminDocIdPreview() {
        const docId = getAdminDocId(); const pre = getAdminFormObj().docIdPreview;
        pre.innerHTML = docId ? `📄 目標 ID: <span class="text-blue-800 bg-blue-100 px-2 py-0.5 rounded">${docId}</span>` : `<span class="text-red-500">⚠️ 請選擇或輸入「單元代號」</span>`;
    }
    function showAdminUnitInput() {
        const f = getAdminFormObj(); f.unitSelector.classList.add("hidden"); document.querySelector("label[for='adminUnitSelector']").classList.add("hidden");
        f.unitId.classList.remove("hidden"); document.querySelector("label[for='adminUnitId']").classList.remove("hidden");
        f.unitId.value = ""; f.unitId.focus(); updateAdminDocIdPreview();
    }
    async function fetchUnitsForAdmin() {
        playSound('click'); const f = getAdminFormObj();
        f.unitSelector.classList.remove("hidden"); document.querySelector("label[for='adminUnitSelector']").classList.remove("hidden");
        f.unitId.classList.add("hidden"); document.querySelector("label[for='adminUnitId']").classList.add("hidden");
        const prefix = [f.publisher.value, f.subject.value, f.semester.value, f.grade.value].join("_") + "_";
        showToast(`🔄 偵測 ${prefix}...`, "info"); f.unitSelector.innerHTML = '<option value="">偵測中...</option>';
        try {
            const qs = await db.collection(CURRICULUM_COLLECTION).where(firebase.firestore.FieldPath.documentId(), ">=", prefix).where(firebase.firestore.FieldPath.documentId(), "<", prefix + "\uf8ff").get();
            if(qs.empty) return f.unitSelector.innerHTML = '<option value="">無單元</option>';
            let units = []; qs.forEach(d => units.push(d.id.replace(prefix,""))); units.sort((a,b) => getSortValue(a)-getSortValue(b));
            f.unitSelector.innerHTML = '<option value="">請選擇單元...</option>' + units.map(u => `<option value="${u}">${u}</option>`).join("");
            updateAdminDocIdPreview();
        } catch(e) { f.unitSelector.innerHTML = '<option value="">❌ 失敗</option>'; }
    }
    async function handleLoadData() {
        playSound('click'); const docId = getAdminDocId(); if(!docId) return showToast("⚠️ 請指定單元", "error");
        const f = getAdminFormObj(); f.labels.forEach(i=>i.value=""); f.contents.forEach(i=>i.value=""); f.mainText.value="";
        try {
            const snap = await db.collection(CURRICULUM_COLLECTION).doc(docId).get();
            if(snap.exists && snap.data().content) {
                const data = snap.data().content;
                (data.fields||[]).forEach((fd, i) => { if(i < f.labels.length) { f.labels[i].value = fd.label||""; f.contents[i].value = (fd.data||[]).join("\n"); } });
                f.mainText.value = data.mainText||""; showToast("✅ 資料載入成功");
            } else showToast("ℹ️ 新資料無內容", "info");
        } catch(e) { showToast("❌ 載入失敗", "error"); }
    }
    async function handleSaveData() {
        playSound('click'); const docId = getAdminDocId(); if(!docId) return showToast("⚠️ 請指定單元", "error");
        const f = getAdminFormObj(); let newFields = [];
        f.labels.forEach((lbl, i) => {
            const v = lbl.value.trim(); const c = f.contents[i].value.trim();
            if(v) newFields.push({label:v, data: c.split('\n').map(s=>s.trim()).filter(Boolean)});
        });
        try {
            await db.collection(CURRICULUM_COLLECTION).doc(docId).set({
                id: docId, publisher: f.publisher.value, subject: f.subject.value, semester: f.semester.value, grade: f.grade.value, unit: docId.split('_').pop(), 
                content: { mainText: f.mainText.value.trim(), fields: newFields }, lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            });
            existingPaths.add(docId); showToast("✅ 儲存成功！"); dom.adminModal.classList.remove("visible"); dom.adminModal.classList.add("hidden");
            currentDocCache = {}; renderNavigator(currentPathParts.length);
        } catch(e) { showToast("❌ 儲存失敗", "error"); }
    }
    async function handleDeleteDocument() {
        playSound('error'); const docId = getAdminDocId(); if(!docId) return showToast("⚠️ 請選擇單元", "error");
        if(!confirm(`⚠️ 確定刪除此課 [${docId}] 嗎？`)) return;
        try {
            await db.collection(CURRICULUM_COLLECTION).doc(docId).delete();
            existingPaths.delete(docId); delete currentDocCache[docId]; showToast("🗑️ 已刪除", "success");
            f.unitId.value = ""; f.labels.forEach(i=>i.value=""); f.contents.forEach(i=>i.value="");
            currentDocCache = {}; renderNavigator(Math.min(currentPathParts.length, getHierarchy().length));
        } catch(e) { showToast("❌ 刪除失敗", "error"); }
    }
    function openAdminModal() { playSound('click'); dom.adminModal.classList.add("visible"); dom.adminModal.classList.remove("hidden"); loadAiSettingsStatus(); loadShortcutsUI(); }

    /* --- 🗄️ v1.7.1 資料維護與安全清理功能 --- */
    
    // 工具: 下載 JSON 備份
    async function exportBackup(prefixName = "雲教室教材備份") {
        try {
            showToast("⏳ 正在打包資料，請稍候...", "info");
            const snap = await db.collection(CURRICULUM_COLLECTION).get();
            const data = []; snap.forEach(doc => data.push(doc.data()));
            
            const jsonStr = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
            a.href = url; a.download = `${prefixName}_${dateStr}.json`;
            a.click(); URL.revokeObjectURL(url);
            
            showToast(`📦 ${prefixName} 下載成功！`, "success");
            return true;
        } catch(e) { showToast("❌ 備份失敗", "error"); console.error(e); return false; }
    }

    // 1. 📦 封存資料
    dom.btnExportBackup.addEventListener('click', () => { playSound('click'); exportBackup(); });

    // 2. 📂 匯入復原
    dom.btnImportBackup.addEventListener('click', () => { playSound('click'); dom.importJsonInput.click(); });
    dom.importJsonInput.addEventListener('change', (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
            try {
                const importedData = JSON.parse(event.target.result);
                if(!Array.isArray(importedData)) throw new Error("非陣列格式");
                
                if(confirm(`📦 成功讀取備份檔！包含 ${importedData.length} 筆資料。\n⚠️ 匯入將「覆寫」現有同名單元資料，確定要開始還原嗎？`)) {
                    showToast("⏳ 雲端批次寫入中，請勿關閉...", "info");
                    
                    let batch = db.batch(); let count = 0;
                    for (const item of importedData) {
                        if(item.id && item.content) {
                            const docRef = db.collection(CURRICULUM_COLLECTION).doc(item.id);
                            batch.set(docRef, item); existingPaths.add(item.id); count++;
                            if (count % 490 === 0) { await batch.commit(); batch = db.batch(); }
                        }
                    }
                    if (count % 490 !== 0) await batch.commit();
                    
                    showToast(`✅ 成功還原 ${count} 筆單元資料！`, "success");
                    currentDocCache = {}; renderNavigator(currentPathParts.length);
                }
            } catch(err) { showToast("❌ 檔案解析失敗，非有效備份檔", "error"); }
            e.target.value = ''; // Reset input
        };
        reader.readAsText(file);
    });

    // 3. 🧹 層級 A：清空面板
    dom.btnClearLevelA.addEventListener('click', () => {
        playSound('click');
        dom.aiResultPreviewDynamic.innerHTML = ''; dom.aiPreviewArea.classList.add('hidden');
        dom.batchLog.innerHTML = ''; dom.batchLog.classList.add('hidden');
        dom.textInputArea.value = ''; dom.fileUploadInput.value = '';
        
        const f = getAdminFormObj();
        f.labels.forEach(i=>i.value=""); f.contents.forEach(i=>i.value=""); f.mainText.value="";
        showAdminUnitInput();
        showToast("🧹 編輯面板與暫存已完全清空", "success");
    });

    // 4. 🗑️ 層級 B：刪除學期
    dom.btnClearLevelB.addEventListener('click', async () => {
        playSound('error'); const f = getAdminFormObj();
        const prefix = [f.publisher.value, f.subject.value, f.semester.value, f.grade.value].join("_");
        const targetName = `${f.publisher.options[f.publisher.selectedIndex].text}_${f.subject.options[f.subject.selectedIndex].text}_${f.semester.options[f.semester.selectedIndex].text}_${f.grade.options[f.grade.selectedIndex].text}`;
        
        const userInput = prompt(`⚠️ 即將刪除整個 [${targetName}] 學期的所有單元！\n此動作無法復原。請輸入「確認」以繼續。`);
        if(userInput !== "確認") return;

        try {
            showToast("⏳ 批次刪除中...", "info");
            const snap = await db.collection(CURRICULUM_COLLECTION)
                .where(firebase.firestore.FieldPath.documentId(), ">=", prefix + "_")
                .where(firebase.firestore.FieldPath.documentId(), "<", prefix + "_\uf8ff").get();
            
            let batch = db.batch(); let count = 0;
            snap.forEach(doc => { batch.delete(doc.ref); existingPaths.delete(doc.id); count++; });
            await batch.commit();

            showToast(`🗑️ 已成功刪除該學期的 ${count} 筆資料`, "success");
            currentDocCache = {}; renderNavigator(Math.min(currentPathParts.length, 4));
        } catch(e) { showToast("❌ 刪除失敗", "error"); console.error(e); }
    });

    // 5. ☢️ 層級 C：全機重置
    dom.btnClearLevelC.addEventListener('click', async () => {
        playSound('error');
        alert("☢️ 準備執行原廠重置！\n系統將先強制下載完整備份，接著徹底清空所有雲端與本機設定資料。");

        const backupSuccess = await exportBackup("雲教室_重置前強制備份");
        if (!backupSuccess) return;

        const userInput = prompt(`⚠️ 備份已下載保護！\n您確定要徹底清空雲端資料庫並抹除本機設定嗎？請輸入「重置」`);
        if (userInput !== "重置") { showToast("已取消重置操作", "info"); return; }

        try {
            showToast("⏳ 正在摧毀雲端資料...", "info");
            const snap = await db.collection(CURRICULUM_COLLECTION).get();
            let batch = db.batch(); let count = 0;
            for(const doc of snap.docs) {
                batch.delete(doc.ref); count++;
                if(count % 490 === 0) { await batch.commit(); batch = db.batch(); }
            }
            if(count % 490 !== 0) await batch.commit();

            showToast("⏳ 正在清空本機設定...", "info");
            localStorage.removeItem(SUBJECTS_STORAGE_KEY);
            localStorage.removeItem(SHORTCUTS_STORAGE_KEY);
            localStorage.removeItem(LAST_WORKSPACE_KEY);
            localStorage.removeItem(API_KEY_STORAGE_KEY);
            localStorage.removeItem(API_MODEL_STORAGE_KEY);
            sessionStorage.removeItem(ADMIN_AUTH_KEY);

            alert("✅ 原廠重置徹底完成！系統將重新載入。"); window.location.reload();
        } catch(e) { showToast("❌ 重置過程發生錯誤", "error"); console.error(e); }
    });


    /* --- AI Processing --- */
    const AI_PROMPTS = {
        ai_shengzi: "任務：分析生字。\n輸出：[{\"grade\":\"G5\",\"semester\":\"S1\",\"lesson\":\"L1\",\"content\":\"字...\"}]\n---請分析：",
        ai_lesson_text: "任務：分析課文。\n輸出：[{\"grade\":\"G5\",\"semester\":\"S1\",\"lesson\":\"L1\",\"content\":\"內文...\"}]\n---請分析：",
        ai_terms: "任務：擷取語詞。\n輸出：[{\"grade\":\"G5\",\"semester\":\"S1\",\"lesson\":\"L1\",\"content\":[\"詞1\"]}]\n---請分析：",
        ai_patterns: "任務：分析句型。\n輸出：[{\"grade\":\"G5\",\"semester\":\"S1\",\"lesson\":\"L1\",\"content\":[\"句1\"]}]\n---請分析："
    };
    function logBatch(msg, type='info') {
        const p = document.createElement('p'); p.textContent = msg; p.className = type;
        dom.batchLog.appendChild(p); dom.batchLog.scrollTop = dom.batchLog.scrollHeight;
    }
    async function handleBatchUpload() {
        playSound('click'); const rawText = dom.textInputArea.value; if(!rawText.trim()) return showToast("⚠️ 沒有文字", "error");
        const apiKey = localStorage.getItem(API_KEY_STORAGE_KEY); if(!apiKey) return showToast("⚠️ 請先設定 API 金鑰", "error");
        
        dom.batchLog.innerHTML = ""; dom.batchLog.classList.remove('hidden'); dom.aiPreviewArea.classList.add('hidden');
        dom.batchUploadBtn.disabled = true; dom.batchUploadBtn.textContent = "⏳ AI 高速運算中...";
        
        let fullPrompt = `您是專業分析師。依照格式回傳合法 JSON 陣列。年級(G1-G6),學期(S1/S2),課次(L1-L12/L1Z)。\n${AI_PROMPTS[dom.analysisMode.value]}\n**額外指令**：\n${dom.aiExtraPrompt.value.trim()}\n---\n${rawText}`;
        try {
            logBatch("⏳ 呼叫 AI 中...", "info");
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${localStorage.getItem(API_MODEL_STORAGE_KEY) || "gemini-1.5-flash-latest"}:generateContent?key=${apiKey}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({contents:[{parts:[{text:fullPrompt}]}]}) });
            const jsonStr = (await res.json()).candidates?.[0]?.content?.parts?.[0]?.text?.replace(/^```json\n/, '').replace(/\n```$/, '').trim();
            if(!jsonStr) throw new Error("無回應");
            
            dom.aiResultPreviewDynamic.innerHTML = '';
            JSON.parse(jsonStr).forEach((item) => {
                const cVal = Array.isArray(item.content) ? item.content.join('\n') : (item.content||'');
                dom.aiResultPreviewDynamic.innerHTML += `<div class="ai-preview-box"><div><label>年級</label><input type="text" data-field="grade" value="${item.grade||''}"></div><div><label>學期</label><input type="text" data-field="semester" value="${item.semester||''}"></div><div class="md:col-span-2"><label>單元代號</label><input type="text" data-field="lesson" value="${item.lesson||''}"></div><div class="content-area"><label>內容</label><textarea data-field="content" rows="4">${cVal}</textarea></div></div>`;
            });
            dom.aiPreviewArea.classList.remove('hidden'); logBatch("✅ 分析完成", "success"); playSound('success');
        } catch (e) { logBatch(`❌ 失敗: ${e.message}`, "error"); showToast("❌ 分析失敗", "error"); }
        finally { dom.batchUploadBtn.disabled = false; dom.batchUploadBtn.textContent = "🔬 重新啟動分析"; }
    }

    async function handleConfirmBatchUpload() {
        playSound('click'); const mode = dom.analysisMode.value;
        const parsedData = Array.from(dom.aiResultPreviewDynamic.querySelectorAll('.ai-preview-box')).map(b => ({
            g: b.querySelector('input[data-field="grade"]').value.trim(), s: b.querySelector('input[data-field="semester"]').value.trim(),
            l: b.querySelector('input[data-field="lesson"]').value.trim(),
            c: (mode==='ai_terms'||mode==='ai_patterns') ? b.querySelector('textarea[data-field="content"]').value.split('\n').filter(Boolean) : b.querySelector('textarea[data-field="content"]').value
        })).filter(i => i.g && i.s && i.l);
        if(!parsedData.length) return;
        
        dom.confirmBatchUploadBtn.disabled = true; dom.confirmBatchUploadBtn.textContent = "⏳ 寫入雲端中...";
        try {
            for(let item of parsedData) {
                const docId = `Hanlin_Chinese_${item.s}_${item.g}_${item.l}`; // Defaulting as original behavior
                const ref = db.collection(CURRICULUM_COLLECTION).doc(docId); const snap = await ref.get();
                let cont = snap.exists ? snap.data().content : { mainText: "", fields: [] }; if(!cont.fields) cont.fields = [];
                const update = (lbl, data) => { const i = cont.fields.findIndex(f=>f.label===lbl); if(i>-1) cont.fields[i].data = data; else cont.fields.push({label:lbl, data}); };
                if(mode==='ai_shengzi') update("習寫字", item.c.split('')); else if(mode==='ai_lesson_text') cont.mainText = item.c;
                else if(mode==='ai_terms') update("語詞", item.c); else if(mode==='ai_patterns') update("句型練習", item.c);
                await ref.set({ id: docId, publisher: "Hanlin", subject: "Chinese", semester: item.s, grade: item.g, unit: item.l, content: cont, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() });
                existingPaths.add(docId);
            }
            showToast("✅ 批次寫入成功！"); dom.aiPreviewArea.classList.add('hidden'); dom.aiResultPreviewDynamic.innerHTML = '';
            currentDocCache = {}; renderNavigator(currentPathParts.length);
        } catch(e) { showToast("❌ 寫入失敗", "error"); }
        finally { dom.confirmBatchUploadBtn.disabled = false; dom.confirmBatchUploadBtn.textContent = "🚀 確認無誤，寫入資料庫"; }
    }

    /* --- Listeners --- */
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(fetchExistingPaths, 100); updateAdminControls();
        dom.settingsBtn.addEventListener("click", () => {
            playSound('click');
            if (sessionStorage.getItem(ADMIN_AUTH_KEY) === 'true') { openAdminModal(); showAdminUnitInput(); } 
            else { const pwd = prompt("請輸入密碼："); if(pwd === ADMIN_PASSWORD) { sessionStorage.setItem(ADMIN_AUTH_KEY, 'true'); updateAdminControls(); showToast("🔓 登入成功", "success"); } else if(pwd) alert("密碼錯誤"); }
        });
        dom.logoutBtn.addEventListener("click", () => { playSound('click'); sessionStorage.removeItem(ADMIN_AUTH_KEY); updateAdminControls(); showToast("🔒 已退出", "info"); });
        document.getElementById("closeAdminBtn").addEventListener("click", () => { playSound('click'); dom.adminModal.classList.remove("visible"); dom.adminModal.classList.add("hidden"); });
        
        dom.addCustomSubBtn.addEventListener("click", addCustomSubject); dom.saveWorkspaceBtn.addEventListener("click", toggleWorkspaceShortcut);
        document.getElementById("loadDataBtn").addEventListener("click", handleLoadData); document.getElementById("saveDataBtn").addEventListener("click", handleSaveData);
        document.getElementById("fetchUnitsBtn").addEventListener("click", fetchUnitsForAdmin); document.getElementById("createNewUnitBtn").addEventListener("click", showAdminUnitInput);
        document.getElementById("deleteDocBtn").addEventListener("click", handleDeleteDocument);
        
        document.getElementById("adminForm").addEventListener('click', (e) => {
            if(e.target.dataset.clearId) { playSound('click'); const id = e.target.dataset.clearId; document.getElementById(`adminLabel${id}`).value = ""; document.getElementById(`adminContent${id}`).value = ""; }
        });
        const f = getAdminFormObj(); [f.publisher, f.subject, f.semester, f.grade, f.unitId, f.unitSelector].forEach(el => { if(el) el.addEventListener(el.tagName==='INPUT'?'input':'change', updateAdminDocIdPreview); });

        dom.fileUploadInput.addEventListener("change", (e) => {
            const file = e.target.files[0]; if(!file) return; const reader = new FileReader();
            if (file.type === "text/plain") { reader.onload = (e) => dom.textInputArea.value = e.target.result; reader.readAsText(file); }
            else if (file.type === "application/pdf") {
                dom.textInputArea.value = "🔄 讀取 PDF 中...";
                reader.onload = async (ev) => {
                    try {
                        const pdf = await pdfjsLib.getDocument(new Uint8Array(ev.target.result)).promise; let text = "";
                        for(let i=1; i<=pdf.numPages; i++) { const page = await pdf.getPage(i); const cont = await page.getTextContent(); text += cont.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join('') + "\n"; }
                        dom.textInputArea.value = text; showToast("✅ PDF 讀取完成", "success");
                    } catch(err) { showToast("❌ 解析失敗", "error"); dom.textInputArea.value = err.message; }
                }; reader.readAsArrayBuffer(file);
            } else showToast("❌ 僅支援 TXT/PDF", "error");
        });
        dom.batchUploadBtn.addEventListener("click", handleBatchUpload); dom.confirmBatchUploadBtn.addEventListener("click", handleConfirmBatchUpload); 
        document.getElementById("saveAiSettingsBtn").addEventListener("click", saveAiSettings);
    });

</script>
